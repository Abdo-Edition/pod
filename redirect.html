<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script>
    // Relire le tag memorise depuis localStorage
    var campaign = localStorage.getItem('kit_campaign') || '';

    // Nettoyer apres utilisation
    if (campaign) {
      localStorage.removeItem('kit_campaign');
      localStorage.removeItem('kit_langue');
      window.location.replace('https://abdo-edition.github.io/pod/' + campaign);
    } else {
      // Fallback — page principale collection
      window.location.replace('https://abdo-edition.github.io/pod/');
    }
  </script>
</head>
<body></body>
</html>
